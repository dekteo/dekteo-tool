name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/Smoke
      - run: dotnet build VeadotubeMy/VeadotubeMy --no-restore
      - run: dotnet run --project tests/Smoke --no-restore
      - run: dotnet run --project tests/Smoke --no-restore -- --render-probe
      - run: dotnet publish VeadotubeMy/VeadotubeMy -c Release --no-restore --no-self-contained -o artifacts/release/app
      - uses: actions/upload-artifact@v4
        with:
          name: Dekteo-Tool-windows
          path: artifacts/release/app/
